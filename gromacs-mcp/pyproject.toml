[project]
name = "gromacs-mcp"
version = "2.2.0"
description = "MCP server exposing GROMACS: system preparation, simulation jobs and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1,<5",
    "loguru>=0.7",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "matplotlib>=3.7"]

# The server runs from a checkout (src/server.py launches scripts/*.py by path), so it is not
# built as a wheel. `uv sync --extra dev` installs the dependencies into .venv.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "gmx: requires a working gmx binary (skipped when GROMACS is missing)",
    "slow: runs a real simulation end to end",
]
